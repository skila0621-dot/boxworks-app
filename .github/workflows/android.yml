name: 안드로이드 시험판 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Play 업로드 키를 푸는 비밀값. 넣어 두면 Play용 파일(AAB)도 만든다
      BX_UPLOAD_PASS: ${{ secrets.BX_UPLOAD_PASS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: 웹 파일 준비
        run: |
          npm ci
          npm run sync

      # 알람 계산·말 해석·자료 지키기·첫 실행을 헤드리스 크롬으로 확인한다. 하나라도 틀리면 설치 파일을 만들지 않는다
      - name: 자동 시험
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          set -o pipefail
          node tests/run.cjs 2>&1 | tee "$GITHUB_WORKSPACE/test.log"

      # 정렬 점검(대표 상시 규칙 11/4 22:59, D-27): 모든 화면 · 창을 폭 360 · 384 · 412 × 라이트 · 다크로 열어
      # 겹침 · 가림 · 잘림 · 칸 어긋남 · 아이콘 세트를 잰다. 하나라도 걸리면 설치 파일을 만들지 않는다
      - name: 정렬 점검
        run: |
          set -o pipefail
          node tests/layout/run.cjs --shots 0 2>&1 | tee "$GITHUB_WORKSPACE/layout.log"

      # 기준 사진(대표 11/5 01:30, D-28): 단추 견본을 대표가 고른 모습(tests/layout/base/)과 비교한다.
      # 기준 사진은 개발 쪽 크로미움에서 찍어 이 컴퓨터와 글자 그리는 방식이 조금 다를 수 있어, 여기서는 기록만 하고 막지 않는다.
      # 시험판을 내기 전 개발 쪽에서 같은 환경으로 비교해 통과해야 낸다
      - name: 기준 사진 비교(기록)
        continue-on-error: true
        run: node tests/layout/base.cjs 2>&1 | tee "$GITHUB_WORKSPACE/base.log"

      - name: 설치 파일(APK) 만들기
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "boxworks-test-${{ github.run_number }}.apk"

      - name: Play용 파일(AAB) 만들기
        if: env.BX_UPLOAD_PASS != ''
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/upload.jks.enc -out "$RUNNER_TEMP/upload.jks" -pass env:BX_UPLOAD_PASS
          set -o pipefail
          BX_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease --no-daemon 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/boxworks-${{ github.run_number }}.aab"
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: boxworks-test-${{ github.run_number }}
          path: |
            boxworks-test-*.apk
            boxworks-*.aab

      # 앱 설정 › 정보에 보이는 '시험판 N'(web-src/tidy.js의 BX_TRIAL)을 이름에 쓴다. 빌드 번호와 달라 헷갈렸음(문제점 점검 기술 11)
      - name: 시험판 번호 읽기
        id: ver
        run: echo "trial=$(grep -oP 'const BX_TRIAL = \K[0-9]+' web-src/tidy.js)" >> "$GITHUB_OUTPUT"

      - name: 휴대폰에서 받을 수 있게 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: 시험판 ${{ steps.ver.outputs.trial }} (빌드 ${{ github.run_number }})
          prerelease: true
          files: boxworks-test-${{ github.run_number }}.apk
          body: |
            안드로이드 시험판 ${{ steps.ver.outputs.trial }}입니다(앱 설정 › 정보에 '시험판 ${{ steps.ver.outputs.trial }}'로 보여요). 휴대폰에서 아래 apk 파일을 눌러 받은 뒤 설치하세요.
            빌드 ${{ github.run_number }} · 커밋: ${{ github.sha }}

      # 저장소를 비공개로 바꿔도 결과(성공·실패, 오류 내용, 설치 파일)를 git으로 받을 수 있게 남긴다
      - name: 결과를 ci-results 브랜치에 남기기
        if: always()
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci
          git init -q -b ci-results
          echo "run=${{ github.run_number }} sha=${{ github.sha }} result=${{ job.status }}" > status.txt
          cp "$GITHUB_WORKSPACE/test.log" . 2>/dev/null || true
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then grep -E "error:|e: |FAILURE|What went wrong|BUILD (SUCCESSFUL|FAILED)" -A6 "$GITHUB_WORKSPACE/build.log" | head -200 > errors.txt || true; tail -80 "$GITHUB_WORKSPACE/build.log" > build-tail.txt; fi
          cp "$GITHUB_WORKSPACE"/boxworks-test-*.apk . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/boxworks-*.aab . 2>/dev/null || true
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "run ${{ github.run_number }}: ${{ job.status }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results
