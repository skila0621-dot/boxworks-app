name: 안드로이드 시험판 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: 웹 파일 준비
        run: |
          npm ci
          npm run sync

      - name: 설치 파일(APK) 만들기
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "boxworks-test-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: boxworks-test-${{ github.run_number }}
          path: boxworks-test-*.apk

      - name: 휴대폰에서 받을 수 있게 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: 시험판 ${{ github.run_number }}
          prerelease: true
          files: boxworks-test-${{ github.run_number }}.apk
          body: |
            박스웍스 안드로이드 시험판입니다. 휴대폰에서 아래 apk 파일을 눌러 받은 뒤 설치하세요.
            커밋: ${{ github.sha }}
