/* Layout: open page, no cards. One left edge for every heading, checkbox and date. PC: left menu + content. Phone: top bar + content + bottom menu bar. */
:root{
  --bg:#FFFFFF; --side:#F6F7F9; --sunk:#F0F2F5; --line:#E5E8EC; --line-2:#CDD2D9;
  --ink:#111418; --ink-2:#4A515B; --ink-3:#858C96;
  --accent:#7C3AED; --accent-ink:#FFFFFF; --accent-soft:#F3EEFE; --accent-text:#7C3AED;
  --warn:#E8710A; --warn-soft:#FDF0E2; --warn-ink:#9C4700;
  --done:#C5CDC9; --danger:#C8372D; --sun:#D23F31; --sat:#2F5BD3;
  --cat-blue:#2a78d6; --cat-aqua:#1baf7a; --cat-yellow:#eda100; --cat-magenta:#e87ba4; --cat-violet:#6250d6; --cat-green:#008300; --cat-red:#e34948; --cat-gray:#8a9490;
  --shadow:0 12px 36px rgba(16,24,40,.16);
  --scrim:rgba(10,16,14,.42);
  --f:"BX Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --dock-h:66px; --gut:20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --side:#0B0D10; --sunk:#1A1D23; --line:#252A31; --line-2:#363C45;
  --ink:#E8EAED; --ink-2:#A9AFB8; --ink-3:#737A84;
  --accent:#7C3AED; --accent-ink:#FFFFFF; --accent-soft:#2A1F48; --accent-text:#A98BFA;
  --warn:#FF9A3D; --warn-soft:#3A2510; --warn-ink:#FFB877;
  --done:#3F4B46; --danger:#F0756B; --sun:#F0756B; --sat:#8AA9FF;
  --cat-blue:#3987e5; --cat-aqua:#199e70; --cat-yellow:#c98500; --cat-magenta:#d55181; --cat-violet:#9085e9; --cat-green:#008300; --cat-red:#e66767; --cat-gray:#7c8782;
  --shadow:0 14px 40px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1115; --side:#0B0D10; --sunk:#1A1D23; --line:#252A31; --line-2:#363C45;
  --ink:#E8EAED; --ink-2:#A9AFB8; --ink-3:#737A84;
  --accent:#7C3AED; --accent-ink:#FFFFFF; --accent-soft:#2A1F48; --accent-text:#A98BFA;
  --warn:#FF9A3D; --warn-soft:#3A2510; --warn-ink:#FFB877;
  --done:#3F4B46; --danger:#F0756B; --sun:#F0756B; --sat:#8AA9FF;
  --cat-blue:#3987e5; --cat-aqua:#199e70; --cat-yellow:#c98500; --cat-magenta:#d55181; --cat-violet:#9085e9; --cat-green:#008300; --cat-red:#e66767; --cat-gray:#7c8782;
  --shadow:0 14px 40px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.6);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
html.locked,html.locked body{overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0;margin:0;text-align:inherit}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ul,ol{margin:0}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sp{flex:1}
svg.i{width:18px;height:18px;display:block;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{min-height:100vh}
.side{display:none}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid transparent}
.appbar-in{height:54px;display:flex;align-items:center;gap:8px;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none;height:40px;min-width:0}
.brand svg{width:26px;height:26px;display:block;flex:none}
.brand b{font-size:18px;font-weight:800;letter-spacing:-.03em;line-height:1}
.brand-t{display:flex;flex-direction:column;gap:3px;min-width:0}
.brand-t small{display:block;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--ink-3);line-height:1}
.brand .brand-t b{font-size:17px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--sunk)}
.icon-btn svg.i{width:20px;height:20px}
.content{padding-top:6px;padding-bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 40px);padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.banner{font-size:13.5px;line-height:1.45;color:var(--warn-ink);background:var(--warn-soft);border-radius:12px;padding:10px 14px;margin:0 0 20px}
.screen{display:flex;flex-direction:column;gap:44px;max-width:680px;margin:0 auto}

/* section header */
.sec-h{display:flex;align-items:center;gap:8px;min-height:40px;margin-bottom:6px}
.sec-h h2{font-size:19px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.sec-sub{font-size:14px;font-weight:500;color:var(--ink-3);line-height:1.2}
.sec-link{display:inline-flex;align-items:center;gap:3px;height:36px;font-size:14px;font-weight:700;color:var(--ink-2);line-height:1;margin-right:-4px;padding-left:8px}
.sec-link svg.i{width:16px;height:16px}
.sec-link:hover{color:var(--ink)}
.sec-link.add{color:var(--accent-text);margin-right:0}
.sec-link.add svg.i{width:18px;height:18px}
.sec-lede{word-break:keep-all;font-size:15px;color:var(--ink-2);line-height:1.55;margin:0 0 18px}
.sec-lede b{color:var(--ink);font-weight:800}
.sec-lede .w{color:var(--warn-ink)}
.grp-h{display:flex;align-items:center;gap:6px;padding:18px 0 8px;font-size:13.5px;font-weight:800;color:var(--ink-2);line-height:1.2}
.grp-h:first-child,.sec-h + .grp-h{padding-top:6px}
.grp-h.warn{color:var(--warn-ink)}
.grp-h svg.i{width:16px;height:16px}

/* hero + summary */
.home-top{display:flex;flex-direction:column;gap:26px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--accent-text);line-height:1.2}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.15;margin-top:8px;text-wrap:balance}
.hero .lede{word-break:keep-all;font-size:15.5px;color:var(--ink-2);line-height:1.55;margin-top:10px}
.hero .lede b{color:var(--ink);font-weight:800}
.hero .lede .w{color:var(--warn-ink)}
.hol{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:color-mix(in srgb,var(--sun) 12%,transparent);color:var(--sun);font-size:12px;font-weight:700;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{display:flex;flex-direction:column;gap:8px;padding:2px 0 2px 18px;border-left:1px solid var(--line);text-align:left;min-width:0}
.stat:first-child{padding-left:0;border-left:0}
.stat-l{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink-2);line-height:1.2}
.stat b{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.stat b small{font-size:16px;font-weight:700;color:var(--ink-3);margin-left:2px}
.stat.warn .stat-l,.stat.warn b{color:var(--warn-ink)}
button.stat:hover b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.lampdot{width:9px;height:9px;border-radius:50%;background:var(--warn);display:block;flex:none}
.prog{display:flex;align-items:center;gap:12px;margin-top:22px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .3s}
.prog span{font-size:13px;font-weight:700;color:var(--ink-2);line-height:1;min-width:34px;text-align:right}
.next{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin-top:14px;text-align:left;color:var(--ink)}
.next svg.i{color:var(--accent-text)}
.next .lbl{font-size:13.5px;font-weight:800;color:var(--accent-text);flex:none;line-height:1.2}
.next .tm{font-size:15px;font-weight:800;flex:none;line-height:1.2;font-variant-numeric:tabular-nums}
.next .tt{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2}
.next .rel{font-size:13.5px;color:var(--ink-3);flex:none;line-height:1.2}
.next.none{color:var(--ink-3);font-size:14.5px}
.next.none svg.i{color:var(--ink-3)}
button.next:hover .tt{color:var(--accent-text)}

/* rows */
.list{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;min-height:66px;padding:10px 0;border-bottom:1px solid var(--line)}
.chk{position:relative;width:24px;height:24px;flex:none;border-radius:8px;border:2px solid var(--line-2);background:var(--bg);display:flex;align-items:center;justify-content:center;color:transparent;transition:background .12s,border-color .12s}
.chk::after{content:"";position:absolute;inset:-12px}
.chk svg.i{width:15px;height:15px;stroke-width:3}
.chk:hover{border-color:var(--accent)}
.row.done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row.late .chk{border-color:var(--warn)}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:14px;text-align:left;min-height:44px}
.row-time{width:46px;flex:none;display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
.row-time b{font-size:15px;font-weight:800;line-height:1.15;letter-spacing:-.02em}
.row-time small{font-size:12.5px;font-weight:500;color:var(--ink-3);line-height:1.15}
.row-time b.allday{font-size:13.5px;font-weight:700;color:var(--ink-2)}
.row-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row-title{font-size:16px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.row-main:hover .row-title{color:var(--accent-text)}
.row-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:13px;color:var(--ink-3);line-height:1.2}
.meta{display:inline-flex;align-items:center;gap:5px;min-width:0}
.meta svg.i{width:14px;height:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink-3));flex:none;display:block}
.meta.late{color:var(--warn-ink);font-weight:700}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;background:var(--sunk);color:var(--ink-2);font-size:11.5px;font-weight:700;line-height:1}
.row.done .row-title{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1.5px}
.row.done .row-time b,.row.done .row-time small{color:var(--ink-3)}
.row.late .row-time b{color:var(--warn-ink)}
.lamp{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn-ink);font-size:13.5px;font-weight:800;line-height:1}
.lamp i{width:9px;height:9px;border-radius:50%;background:var(--warn);display:block;flex:none}
.row.blink .lamp i,.lampdot.blink{animation:lamp 1.1s ease-in-out infinite}
@keyframes lamp{0%,100%{opacity:1;box-shadow:0 0 0 0 color-mix(in srgb,var(--warn) 60%,transparent)}50%{opacity:.35;box-shadow:0 0 0 7px color-mix(in srgb,var(--warn) 0%,transparent)}}
.now-line{display:flex;align-items:center;gap:10px;height:26px;padding-left:8px;color:var(--accent-text);font-size:12.5px;font-weight:800;line-height:1}
.now-line i{width:8px;height:8px;border-radius:50%;background:var(--accent-text);display:block;flex:none}
.now-line::after{content:"";flex:1;height:2px;border-radius:1px;background:var(--accent-text);opacity:.5}
.empty{word-break:keep-all;padding:16px 0 4px;color:var(--ink-3);font-size:14.5px;line-height:1.55}
.empty b{color:var(--ink-2)}
.list + .empty,.list .empty{border:0}

/* week summary */
.wk{border-top:1px solid var(--line)}
.wk-row{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;padding:8px 0;border-bottom:1px solid var(--line);text-align:left}
.wk-day{width:60px;flex:none;display:flex;align-items:center;gap:8px}
.wk-dow{width:16px;font-size:14px;font-weight:700;color:var(--ink-2);line-height:1}
.wk-num{width:30px;height:30px;margin-left:-2px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15.5px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.is-sun .wk-dow,.is-hol .wk-dow,.is-sun .wk-num,.is-hol .wk-num{color:var(--sun)}
.is-sat .wk-dow,.is-sat .wk-num{color:var(--sat)}
.wk-row.today .wk-dow{color:var(--accent-text)}
.wk-row.today .wk-num{background:var(--accent);color:var(--accent-ink)}
.wk-items{flex:1;min-width:0;display:flex;align-items:center;gap:16px;overflow:hidden}
.wi{display:inline-flex;align-items:center;gap:6px;min-width:0;flex:0 1 auto;font-size:14px;line-height:1.2}
.wi .wt{font-weight:700;color:var(--ink-2);flex:none;font-variant-numeric:tabular-nums}
.wi .wn{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wi.done .wn,.wi.done .wt{color:var(--ink-3)}
.wi.done .wn{text-decoration:line-through}
.wi.late .wn,.wi.late .wt{color:var(--warn-ink)}
.wk-empty{font-size:14px;color:var(--ink-3);line-height:1.2}
.wk-hol{font-size:13px;font-weight:700;color:var(--sun);line-height:1.2}
.wk-count{flex:none;min-width:34px;text-align:right;font-size:13.5px;font-weight:700;color:var(--ink-3);line-height:1}
.wk-row.past .wk-day,.wk-row.past .wk-items,.wk-row.past .wk-count{opacity:.5}
.wk-row:hover .wn{color:var(--accent-text)}

/* month summary */
.mchart{position:relative}
.mc-h{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;margin-bottom:12px}
.mchart .mc-h{margin-bottom:28px}
.mc-h .t{font-size:14px;font-weight:800;color:var(--ink);line-height:1.2;margin-right:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);line-height:1.2}
.lg i{width:10px;height:10px;border-radius:3px;background:var(--c);display:block;flex:none}
.plot{position:relative;height:96px;border-bottom:1px solid var(--line-2)}
.plot .gl{position:absolute;left:0;right:0;top:0;border-top:1px solid var(--line)}
.plot .gl span{position:absolute;right:0;top:-18px;font-size:11.5px;font-weight:600;color:var(--ink-3);line-height:1}
.cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--days),minmax(0,1fr));column-gap:2px;align-items:end}
.col{height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;border-radius:4px}
.col:hover,.col:focus-visible{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.stk{width:min(100%,16px);display:flex;flex-direction:column-reverse;gap:2px}
.stk i{display:block;min-height:3px}
.stk i:last-child{border-radius:4px 4px 0 0}
.stk .s-done{background:var(--done)}
.stk .s-up{background:var(--accent)}
.stk .s-late{background:var(--warn)}
.xl{display:grid;grid-template-columns:repeat(var(--days),minmax(0,1fr));column-gap:2px;margin-top:6px;height:16px}
.xl span{font-size:11.5px;font-weight:600;color:var(--ink-3);text-align:center;line-height:16px;white-space:nowrap;overflow:visible;font-variant-numeric:tabular-nums}
.xl span.today{color:var(--accent-text);font-weight:800}
.mc-note{word-break:keep-all;margin-top:10px;font-size:13px;color:var(--ink-3);line-height:1.4}
.tip{position:absolute;z-index:5;transform:translate(-50%,-100%);background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;line-height:1.45;padding:7px 10px;border-radius:9px;white-space:nowrap;pointer-events:none;box-shadow:var(--shadow)}
.tip b{font-weight:800}
.cats{margin-top:28px}
.catbar{display:flex;gap:2px;height:10px;margin-bottom:12px}
.catbar i{display:block;height:100%;background:var(--c)}
.catbar i:first-child{border-radius:5px 0 0 5px}
.catbar i:last-child{border-radius:0 5px 5px 0}
.catbar i:only-child{border-radius:5px}
.catbar.empty{background:var(--sunk);border-radius:5px}
.lg b{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.lg .dot{width:9px;height:9px}
.ups{margin-top:28px}
.up-row{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:8px 0;border-bottom:1px solid var(--line);text-align:left}
.up-d{width:46px;flex:none;font-size:13.5px;font-weight:800;color:var(--accent-text);line-height:1;font-variant-numeric:tabular-nums}
.up-date{width:78px;flex:none;font-size:14px;font-weight:600;color:var(--ink-2);line-height:1.2;font-variant-numeric:tabular-nums}
.up-t{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;line-height:1.3}
.up-t .tm{font-weight:700;color:var(--ink-2);flex:none;font-variant-numeric:tabular-nums}
.up-t .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up-row:hover .nm{color:var(--accent-text)}
.more-link{display:inline-flex;align-items:center;gap:3px;height:40px;font-size:14px;font-weight:700;color:var(--ink-2);line-height:1}
.more-link svg.i{width:16px;height:16px}

/* page head (week / month / guide) */
.page-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:16px}
.ph-t{display:contents}
.page-head h1{grid-column:1;grid-row:1}
.page-head .ph-nav{grid-column:2;grid-row:1}
.page-head p{grid-column:1/-1;grid-row:2}
.nw{white-space:nowrap}
.page-head h1{font-size:28px;font-weight:800;letter-spacing:-.035em;line-height:1.15}
.page-head p{word-break:keep-all;font-size:14.5px;color:var(--ink-2);margin-top:8px;line-height:1.4}
.page-head p b{color:var(--ink);font-weight:800}
.page-head p .w{color:var(--warn-ink)}
.ph-nav{display:flex;align-items:center;gap:6px}
.nav-btn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line-2);color:var(--ink-2);flex:none}
.nav-btn:hover{background:var(--sunk)}
.pill-btn{display:inline-flex;align-items:center;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);font-size:14px;font-weight:700;line-height:1}
.pill-btn:hover{background:var(--sunk)}
.pill-btn[aria-pressed="true"]{background:var(--sunk);color:var(--ink-3);cursor:default}
.screen.page{gap:28px}
.cell,.day-g,.c-chip{touch-action:manipulation}
.day-g{cursor:default}
.rem-custom{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.rem-picks .pick{height:36px;padding:0 13px;font-size:13.5px}
.pick.ghost{border-style:dashed;color:var(--ink-2)}
.pick.ghost svg.i{width:15px;height:15px}
.pick .x{margin-left:1px;font-weight:600;opacity:.7}
.inp.num{width:80px}
.rem-when s{color:var(--ink-3)}
.fld-sub{font-size:12.5px;font-weight:600;color:var(--ink-3);margin-left:6px}
.rem-when{margin-top:6px}
.rem-when b{color:var(--ink);font-weight:700}
.rem-when .w{color:var(--warn-ink);font-weight:700}
/* period toolbar (week / month) stays reachable while scrolling:
   phone & tablet -> it lives in the sticky app bar; PC -> the page head sticks to the top */
.ab-view{display:none}
.appbar.vmode .brand-t,.appbar.vmode .ab-guide,.appbar.vmode .sp{display:none}
.appbar.vmode .brand{flex:none}
.appbar.vmode .ab-view{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.ab-t{flex:1;min-width:0;font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-view .ph-nav{gap:5px}
.ab-view .nav-btn{width:36px;height:36px;border-radius:11px}
.ab-view .pill-btn{height:36px;padding:0 12px;font-size:13.5px;border-radius:11px}
.appbar.stuck{border-bottom-color:var(--line)}
@media (max-width:1023px){
  .screen.week .page-head h1,.screen.week .page-head .ph-nav,.screen.month .page-head h1,.screen.month .page-head .ph-nav{display:none}
  .screen.week .page-head p,.screen.month .page-head p{margin-top:0}
}
@media (min-width:1024px){
  .screen.week .page-head,.screen.month .page-head{position:sticky;top:0;z-index:20;background:var(--bg);padding:16px 0 14px;margin:-16px 0 -14px;border-bottom:1px solid transparent;transition:border-color .15s}
  .screen.week .page-head.stuck,.screen.month .page-head.stuck{border-bottom-color:var(--line)}
}
.day-g .sec-h{margin-bottom:4px}
.day-d{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.day-w{font-size:15px;font-weight:700;color:var(--ink-2);line-height:1.2}
.day-m{font-size:14px;color:var(--ink-3);line-height:1.2}
.day-g.is-sun .day-w,.day-g.is-hol .day-w,.day-g.is-sun .day-d,.day-g.is-hol .day-d{color:var(--sun)}
.day-g.is-sat .day-w,.day-g.is-sat .day-d{color:var(--sat)}
.day-tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:800;line-height:1}
.day-g .empty{padding:12px 0 0;border-top:1px solid var(--line)}

/* month calendar */
.month-wrap{display:grid;gap:36px}
.cal-head,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-head span{display:flex;align-items:center;justify-content:center;height:30px;font-size:13px;font-weight:700;color:var(--ink-3);line-height:1}
.cal-head span.sun{color:var(--sun)} .cal-head span.sat{color:var(--sat)}
.cal{border-top:1px solid var(--line)}
.cell{min-height:64px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:5px;border-bottom:1px solid var(--line);min-width:0;border-radius:0}
.cell > *{min-width:0}
.cell.other > *{opacity:.35}
.cell:hover{background:var(--sunk)}
.cell.sel{background:var(--accent-soft)}
.c-top{display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;width:100%}
.c-num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;flex:none}
.cell.is-sun .c-num,.cell.is-hol .c-num{color:var(--sun)}
.cell.is-sat .c-num{color:var(--sat)}
.cell.today .c-num{background:var(--accent);color:var(--accent-ink)}
.c-hol{display:none}
.c-dots{display:flex;align-items:center;justify-content:center;gap:3px;height:6px}
.c-dots i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--ink-3));display:block}
.c-dots i.late{background:var(--warn)}
.c-dots i.done{background:var(--done)}
.c-chips{display:none}
.mini-cal{margin:2px 0 20px}
.mini-cal .cal-head span{justify-content:center;padding-left:0}
.mini-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);padding-top:4px}
.mc-cell{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 6px;min-width:0;border-radius:10px}
.mc-cell:hover{background:var(--sunk)}
.mc-cell .c-num{width:30px;height:30px;font-size:14px}
.mc-cell.other > *{opacity:.35}
.mc-cell.is-sun .c-num,.mc-cell.is-hol .c-num{color:var(--sun)}
.mc-cell.today .c-num{background:var(--accent);color:var(--accent-ink)}

/* guide */
.g-sec{scroll-margin-top:72px}
.g-sec h2{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.3;margin-bottom:12px}
.g-sec h3{font-size:16px;font-weight:800;margin:22px 0 8px;line-height:1.3}
.g-sec p{word-break:keep-all;font-size:15.5px;line-height:1.75;color:var(--ink-2);margin-bottom:12px}
.g-sec p b,.g-sec li b{color:var(--ink);font-weight:800}
.g-sec ul,.g-sec ol{padding-left:22px;margin-bottom:12px}
.g-sec li{word-break:keep-all;font-size:15.5px;line-height:1.75;color:var(--ink-2);margin-bottom:4px}
.fig{background:var(--side);border-radius:16px;padding:6px 18px;margin:16px 0}
.fig .list{border-top:0}
.fig .row:last-child{border-bottom:0}
.fig-cap{font-size:13px;color:var(--ink-3);margin:-6px 0 18px;line-height:1.5}
.gtab{width:100%;border-collapse:collapse;margin:12px 0 16px;font-size:14.5px}
.gtab th,.gtab td{text-align:left;padding:11px 12px 11px 0;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55}
.gtab th{font-size:13px;color:var(--ink-3);font-weight:700}
.gtab td:first-child{font-weight:700;color:var(--ink);white-space:nowrap}
.gtab td{color:var(--ink-2)}
.tbl-wrap{overflow-x:auto}
kbd{font-family:var(--f);font-size:12.5px;font-weight:700;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;padding:2px 7px;background:var(--bg);color:var(--ink)}
.wire{display:grid;grid-template-columns:96px 1fr;gap:10px;background:var(--side);border-radius:16px;padding:14px;margin:16px 0}
.wire .w-side{background:var(--bg);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.wire .w-main{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wire .w-b{background:var(--bg);border-radius:10px;padding:10px;font-size:12.5px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:6px;min-height:44px;line-height:1.3}
.wire .w-b.full{grid-column:1/-1}
.wire .w-b.tall{min-height:110px;align-items:flex-start}
.wire .w-s{height:10px;border-radius:5px;background:var(--line)}
.wire .w-s.a{background:var(--accent);width:70%}
.num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:800;flex:none;line-height:1}

/* side menu (PC) */
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 0;min-height:48px}
.side-brand svg{width:30px;height:30px;flex:none;display:block}
.side-home{display:flex;align-items:center;gap:10px;min-width:0;color:inherit;text-decoration:none;border-radius:10px;margin:-4px;padding:4px}
.side-home:hover b{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.side-brand b{display:block;font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.side-brand .brand-t b{font-size:19px}

/* ---------- storage ---------- */
const server = new Map(), over = new Map(), inflight = new Set(), dirty = new Set(), timers = new Map();
function getDoc(id){ return over.has(id) ? over.get(id) : (server.get(id) || null); }

function writeDoc(id, doc){ over.set(id, doc); flush(id); scheduleRender(); }

async function flush(id, retried){
  if (inflight.has(id)) { dirty.add(id); return; }
  if (!over.has(id)) return;
  const val = over.get(id);
  if (S.mode === 'local') { if (val === null) server.delete(id); else server.set(id, val); over.delete(id); saveLocal(); return; }
  if (S.mode !== 'db' || S.readOnly) return;
  inflight.add(id);
  try { const ref = S.col.doc(id); if (val === null) await ref.delete(); else await ref.set(val); }
  catch (e) { inflight.delete(id); onWriteError(e, id, retried); return; }
  inflight.delete(id);
  if (dirty.has(id)) { dirty.delete(id); flush(id); return; }
  if (over.get(id) !== val) return;
  const sv = server.get(id);
  if ((val === null && !sv) || (val && sv && stable(sv) === stable(val))) { over.delete(id); return; }
  setTimeout(() => { if (over.get(id) === val && !inflight.has(id) && !timers.has(id)) { over.delete(id); scheduleRender(); } }, 4000);
}
function onWriteError(e, id, retried){

  if (code === 'invalid_argument') { S.readOnly = true; showBanner('이 계정으로는 저장할 수 없어요. 스케줄러를 만든 계정으로 열면 저장돼요.'); return; }
  if (code === 'quota_exceeded') { toast('저장 공간이 가득 찼어요. 더보기 → 휴지통을 비운 뒤 다시 시도해 주세요.'); return; }
  if (code === 'revoked') { showBanner('저장소 연결이 끊겼어요. 페이지를 다시 열어 주세요.'); return; }
  toast('저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
}
function onSnap(snap){

  over.forEach((v, id) => {
    if (inflight.has(id) || timers.has(id) || dirty.has(id)) return;
    const sv = server.get(id);

}

/* earlier versions kept separate "task" and "event" documents; fold them into one schedule item */
function migrate(){
  allDocs().forEach((d, id) => {
    if (d && d.type === 'category' && OLD_COLORS[d.color]) { writeDoc(id, Object.assign({}, d, {color: id === 'c_etc' && d.color === '#6B7280' ? '#eda100' : OLD_COLORS[d.color]})); return; }
    if (!d || (d.type !== 'task' && d.type !== 'event')) return;
    const base = {type: 'item', categoryId: d.categoryId || null, note: d.note || '', slips: 0, createdAt: d.createdAt || nowIso(), updatedAt: nowIso()};
    let it;
    if (d.type === 'task') {
      const date = isDate(d.due) ? d.due : ymd(new Date(d.createdAt || Date.now()));
      const start = isHM(d.dueTime) ? d.dueTime : null;
      const rule = d.remindRule;
      const remind = !rule || rule === 'custom' ? '' : rule === 'morning' ? 'am9' : !start ? 'am9' : rule === 'due-1h' ? '60' : '0';
      it = Object.assign(base, {title: String(d.title || '').trim(), date, start, end: null, location: '', done: !!d.done, doneAt: d.doneAt || null, remind});
    } else {
      const s = String(d.start || ''), allDay = !!d.allDay || s.length === 10;
      const date = isDate(s.slice(0, 10)) ? s.slice(0, 10) : ymd(new Date());
      const start = !allDay && isHM(s.slice(11, 16)) ? s.slice(11, 16) : null;
      let end = start && d.end && String(d.end).slice(0, 10) === date && isHM(String(d.end).slice(11, 16)) ? String(d.end).slice(11, 16) : null;
      if (end && end <= start) end = null;

      it = Object.assign(base, {title: String(d.title || '').trim(), date, start, end, location: d.location || '', done: false, doneAt: null, remind});
    }

function pruneRoutines(){ const lim = ymd(addDays(new Date(), -7)); allDocs().forEach((d, id) => { if (!d) return; if (d.type === 'routine' && d.once && d.once < lim) removeDoc(id); else if (d.type === 'rlog' && d.date && d.date < ymd(addDays(new Date(), -60))) removeDoc(id); }); }

    if (!getDoc('settings')) writeDoc('settings', Object.assign({}, DEFAULT_SETTINGS, {createdAt: nowIso()}));

}

/* ---------- model ---------- */
function buildModel(){

  const items = [], cats = [], trash = [], routines = [], rlogs = new Map();

  allDocs().forEach((d, id) => {
    if (!d || !d.type) return;
    if (d.type === 'item') { const x = Object.assign({}, d, {id}); if (!isDate(x.date)) return; (d.deletedAt ? trash : items).push(x); }
    else if (d.type === 'category') cats.push(Object.assign({}, d, {id}));
    else if (d.type === 'routine') routines.push(Object.assign(rtNorm(d), {id, order: d.order || 0}));
    else if (d.type === 'rlog' && d.rid && d.date) rlogs.set(d.rid + '|' + d.date, d);
    else if (id === 'settings') settings = Object.assign(settings, d);
  });
  cats.sort((a, b) => (a.order || 0) - (b.order || 0));
  const byDate = new Map();
  items.forEach(it => { if (!byDate.has(it.date)) byDate.set(it.date, []); byDate.get(it.date).push(it); });
  byDate.forEach(a => a.sort(byTime));
  routines.sort((a, b) => rtPlan(a).start - rtPlan(b).start || (a.order || 0) - (b.order || 0));
  return {now, today, items, cats, catMap: new Map(cats.map(c => [c.id, c])), settings, trash, byDate, routines, rlogs};
}
function bySummary(a, b){ const r = i => isLate(i) ? 0 : i.done ? 2 : 1; return r(a) - r(b) || byTime(a, b); }
function byTime(a, b){ return (a.start ? 1 : 0) - (b.start ? 1 : 0) || String(a.start || '').localeCompare(String(b.start || '')) || String(a.createdAt || '').localeCompare(String(b.createdAt || '')); }

const SOON_MIN = 30;

function timeState(it){

  '<section class="g-sec" id="g-add"><h2>일정 추가하기</h2><ol><li>아래 툴바 가운데 <b>+</b>를 눌러요. PC는 왼쪽 위 <b>새 일정</b>이나 단축키 <kbd>N</kbd>도 돼요.</li><li>제목 칸에 할 일을 적어요. 날짜와 시간을 함께 적으면 아래 탭에 자동으로 채워져요.</li><li>제목 아래 탭(날짜·시간·알림·분류·장소·메모)에 지금 값이 보여요. 바꿀 탭만 눌러 열고 고쳐요. 한 번에 하나만 열려요. <b>시간 정하기</b> 탭을 누르면 바로 시작·끝 시각을 고를 수 있고, <b>예상 소요시간</b>은 <b>빠른 선택</b>이나 <b>직접 입력</b>(시간·분)으로 정해요.</li><li><b>저장</b>을 누르면 오늘·주간·월간 화면에 바로 보여요.</li></ol><p><b>더 빠르게</b>: 오늘 화면 달력에서 날짜를 누르면 그날 창 아래에서 제목과 시각(시계 칸)만 적고 <b>추가</b>를 눌러 바로 넣을 수 있어요. 월간 달력의 날짜 칸이나 주간 일정의 빈 곳을 <b>두 번 누르면</b>(더블클릭) 그 날짜로 새 일정 창이 열려요.</p><p>제목에 ‘내일 3시’처럼 적으면 날짜·시간이 자동으로 채워지는데, 이것은 AI가 아니라 스케줄러가 직접 읽는 기능이에요. 직접 고른 날짜·시간이 있으면 그 값이 우선이에요.</p>' +
  tbl(['이렇게 적으면', '이렇게 들어가요'], [['내일 오후 3시 거래처 미팅', '내일 15:00–16:00, 제목 ‘거래처 미팅’'], ['금요일까지 견적서 보내기', '가장 가까운 금요일, 종일, 제목 ‘견적서 보내기’'], ['11월 5일 10시~12시 교육', '11월 5일 10:00–12:00, 제목 ‘교육’'], ['다음 주 화요일 오전 10시 치과', '다음 주 화요일 10:00, 제목 ‘치과’'], ['모레 저녁 7시 반 저녁 약속', '모레 19:30, 제목 ‘저녁 약속’']]) +
  '<p>오전·오후를 쓰지 않으면 1시~7시는 오후로 봐요. 장소와 메모는 <b>장소·메모</b> 탭을 눌러 적어요.</p></section>' +

  '<section class="g-sec" id="g-edit"><h2>일정 고치기</h2><p>목록의 일정을 누르면 수정 창이 열려요. PC 월간 달력에서는 칸 안의 일정 제목을 <b>두 번 누르면</b> 바로 수정 창이 열려요. 수정 창에서 날짜·시간·분류·알림·장소·메모를 고치고 <b>저장</b>을 눌러요.</p></section>' +

  '<section class="g-sec" id="g-done"><h2>완료 표시하기</h2><p>일정 왼쪽의 동그라미를 누르면 <b>완료한 일정</b>으로 바뀌어요. 글자에 줄이 그어지고 오늘 상자의 점수와 완료 고리가 바로 바뀌어요. 잘못 눌렀다면 다시 누르거나 화면에 뜨는 <b>되돌리기</b>를 눌러요.</p>' +
  '<div class="fig" aria-hidden="true"><div class="list">' + demoRow({start: '09:00', end: '10:00', title: '팀 주간 회의', cat: '업무', c: 'var(--ink-3)'}) + demoRow({start: '09:00', end: '10:00', title: '팀 주간 회의', cat: '업무', c: 'var(--ink-3)', done: true}) + '</div></div><p class="fig-cap">위: 완료 전, 아래: 완료 후</p></section>' +

  '<section class="g-sec" id="g-soon"><h2>시간이 촉박한 일정</h2><p>오늘 일정 중 30분 안에 시작하는 일정에는 메인 색(기본 파랑) 글씨로 <b>곧 시작 · 20분 뒤</b>가, 시작했고 아직 끝 시간 전인 일정에는 <b>진행 중 · 40분 남음</b>이 붙어요. 진행 중인 일정은 왼쪽에 메인 색 줄이 생겨요. 끝 시간이 지나면 주황 <b>확인</b> 버튼으로 바뀌어요.</p></section>' +

  '<section class="g-sec" id="g-late"><h2>시간이 지난 일정 처리하기</h2><p>끝 시간이 지났는데 완료하지 않은 일정에는 주황색 <b>확인</b> 버튼이 깜빡여요. 끝 시간이 없으면 시작 시간이 기준이고, 시간이 없는 일정은 그날이 지나면 경고등이 켜져요.</p>' +
  '<div class="fig" aria-hidden="true"><div class="list">' + demoRow({start: '14:00', end: '15:00', title: '차량팀 방문', cat: '업무', c: 'var(--ink-3)', late: '20분 지남'}) + '</div></div>' +
  '<p><b>확인</b>을 누르면 아래 중에서 골라요. 지연이나 연기는 고른 뒤 아래 버튼을 눌러야 적용돼요.</p>' +
  tbl(['선택', '하는 일'], [['지연', '오늘 안에서 시간을 미뤄요. 30분·1시간·2시간·3시간 뒤 중에서 고르면 바뀔 시각이 함께 보여요. 일정 길이는 그대로예요.'], ['연기', '내일·모레·다음 주 월요일이나 원하는 날짜로 옮겨요. 시간은 그대로 두고 날짜만 바꿔요.'], ['수정', '일정 수정 창을 열어 직접 고쳐요.'], ['완료', '이미 끝낸 일정이면 완료로 표시해요.'], ['깜빡임 끄기', '지금은 처리하지 않고 깜빡임만 꺼요. 주황 표시는 처리할 때까지 남아요.']]) +
  '<p>지연하거나 연기한 일정에는 ‘미룸 1회’처럼 미룬 횟수가 표시돼요.</p></section>' +

  '<section class="g-sec" id="g-views"><h2>주간·월간 화면 보기</h2><h3>주간 일정</h3><p>아래 툴바의 <b>주간</b>을 누르면 이번 주 일정이 요일별로 모두 나와요. 위쪽 화살표로 지난 주·다음 주로 넘어가요. 화살표는 아래로 내려도 화면 위에 붙어 있어요. 빈 곳을 두 번 누르면 그 날짜로 새 일정 창이 열려요.</p>' +
  '<h3>월간 일정</h3><p>월간 화면은 큰 달력이에요. 날짜를 누르면 그날 일정이 PC는 오른쪽, 휴대폰은 아래에 나와요. 날짜 칸을 두 번 누르면 그 날짜로 새 일정 창이 열려요.</p></section>' +

  '<section class="g-sec" id="g-ai"><h2>AI로 여러 일정 한 번에 정리하기</h2><ol><li>새 일정 창의 제목 칸에 여러 일정을 한 문장으로 적어요. 예) 다음 주 화요일 10시 거래처 미팅, 그 전에 견적서 보내고 금요일까지 계약서 검토</li><li><b>AI 정리</b>를 눌러요.</li><li>나뉜 일정을 확인해요. 날짜가 애매한 일정에는 ‘확인 필요’가 붙어요. 고친 뒤 저장해요.</li></ol><p>처음 쓸 때 AI 사용을 허용할지 한 번 물어봐요. AI 사용량은 본인 Claude 계정에서 차감돼요. AI를 쓰지 않아도 다른 기능은 모두 동작해요.</p></section>' +

  '<section class="g-sec" id="g-alarm"><h2>알림</h2><p>일정 창의 <b>알림</b> 탭을 열고 원하는 만큼 추가해요. 여러 개를 넣으면 정한 시각마다 한 번씩 알려 주고, 정한 알림 옆 ×를 누르면 빠져요. 알림이 하나도 없으면 오지 않아요. 한 일정에 5개까지 정할 수 있어요.</p>' +
  tbl(['방식', '정하는 법'], [['사전 알림 (시간을 정한 일정)', '− / + 버튼이나 숫자로 몇 분·시간·일 전인지 정하고 추가해요. 0분은 정시예요.'], ['정한 시각', '당일·전날·2일 전·3일 전·일주일 전 중 하루를 고르고, 시계에서 시각을 골라 추가해요.']]) +
  '<p>알림 칸 아래에 실제로 알려 줄 시각이 모두 나와요. 이미 지난 시각은 줄이 그어져요. 새 일정에 자동으로 들어가는 알림은 <b>설정</b>의 <b>당일 예약된 일정 사전 알림 시간</b>(시작 몇 분 전)과 <b>당일 일정 정기알람 시간</b>(시간 없는 일정의 알림 시각)에서 숫자와 시계로 정해요.</p><p>일정 알림과 경고등은 <b>스케줄러가 열려 있을 때</b> 화면과 소리로 알려 줘요. 창을 닫았을 때도 오늘 일정을 받으려면 아래 <b>아침 일정 보고</b>를 켜 두세요.</p></section>' +

  '<section class="g-sec" id="g-report"><h2>아침 일정 보고</h2><p>매일 오전 8시 전에 오늘 할 일을 정리해 <b>휴대폰 Claude 앱 알림</b>으로 보내요. 보고에는 확인이 필요한 지난 일정, 오늘 할 일(시간 순), 앞으로 3일 동안의 일정이 들어가요.</p><ul><li><b>설정 → 아침 일정 보고</b>에서 받기·끄기와 매일·평일만을 고를 수 있어요. 바꾼 설정은 다음 날 아침 보고부터 적용돼요.</li><li>알림이 오려면 휴대폰에 Claude 앱이 설치되어 있고 앱 알림이 켜져 있어야 해요.</li><li>카카오톡으로는 보낼 수 없어요. 카카오 서버에 연결할 수 없는 환경이라서예요.</li></ul></section>' +

  '<section class="g-sec" id="g-devices"><h2>휴대폰·태블릿·PC에서 쓰기</h2><p>스케줄러는 Claude 안에서 열리는 웹 앱이에요. 앱 스토어 설치 대신 각 기기의 홈 화면이나 바탕화면에 바로가기를 만들어 앱처럼 써요.</p>' +
  tbl(['기기', '바로가기 만드는 법'], [['아이폰·아이패드', 'Safari로 스케줄러를 열고 공유 버튼 → <b>홈 화면에 추가</b>'], ['안드로이드', 'Chrome으로 열고 오른쪽 위 ⋮ → <b>홈 화면에 추가</b>'], ['PC (Chrome·Edge)', '스케줄러를 열고 주소창 오른쪽 메뉴에서 <b>바로가기 만들기</b>(창으로 열기 체크) 또는 <b>앱으로 설치</b>']]) +
  '<p><b>같은 Claude 계정</b>으로 로그인하면 모든 기기에서 같은 일정이 보이고, 한 기기에서 고치면 다른 기기에도 바로 반영돼요. 다른 계정끼리는 일정이 공유되지 않아요. 다른 계정으로 옮기려면 <b>백업·복원</b>으로 파일을 받아 불러오세요.</p><p>메뉴 접기, 위젯 모드처럼 화면 모양에 대한 선택은 기기마다 따로 기억해요.</p></section>' +

  '<section class="g-sec" id="g-share"><h2>다른 사람과 함께 쓰기</h2><p>스케줄러 링크를 공유하면 받은 사람도 자기 Claude 계정으로 로그인해 <b>자기 일정만 따로</b> 쓸 수 있어요. 일정은 계정마다 따로 저장되어 서로 보이지 않고, AI 정리를 쓰면 쓰는 사람 계정의 사용량이 차감돼요.</p><ol><li>만든 사람이 Claude 화면에서 스케줄러의 <b>공유</b> 메뉴로 링크를 열어 줘요.</li><li>받은 사람은 링크를 열고 Claude에 로그인해요.</li><li>휴대폰 홈 화면이나 PC 바로가기에 추가해 앱처럼 써요.</li></ol><p>매일 아침 보고는 Claude의 예약 작업으로 보내므로, 받는 사람이 자기 Claude에서 따로 만들어야 해요. 처음 열 때 나오는 <b>스케줄러 시작하기</b> 창이나 <b>설정 → 연동 → 알림 등록 안내문 받기</b>에서 안내문을 복사해 자기 Claude 대화창에 보내면 돼요.</p></section>' +

  '<section class="g-sec" id="g-widget"><h2>PC 바탕화면 위젯으로 쓰기</h2><ol><li>PC에서 스케줄러를 바로가기(창으로 열기)로 열어요.</li><li>왼쪽 메뉴의 <b>위젯 모드</b>를 눌러요. 메뉴와 아래 툴바가 사라지고 월간 달력과 고른 날의 일정만 남아요.</li><li>창을 작게 줄여 화면 구석에 두세요. 폭이 480px보다 넓으면 달력 칸에 일정 제목이, 760px보다 넓으면 오른쪽에 그날 일정 목록이 나와요.</li><li>Windows에서 다른 창 위에 늘 띄워 두려면 Microsoft PowerToys의 <b>Always On Top</b>(<kbd>Win</kbd> + <kbd>Ctrl</kbd> + <kbd>T</kbd>)을 써요.</li></ol><p>위젯에서도 + 버튼으로 일정을 넣고 체크로 완료할 수 있어요. 끝낼 때는 오른쪽 위 <b>전체 화면</b> 버튼을 눌러요. 위젯 모드는 기기마다 기억되어 다음에 열 때도 위젯으로 열려요. 배경화면 속에 직접 넣는 방식은 Claude 로그인이 필요한 화면이라 지원하지 않아요.</p></section>' +

function record(ids){ S.undo = ids.map(id => ({id, before: getDoc(id) ? JSON.parse(JSON.stringify(getDoc(id))) : null})); }
function doUndo(){
  const u = S.undo; if (!u) { toast('되돌릴 작업이 없어요.'); return; }
  S.undo = null;
  u.forEach(r => { if (r.before) writeDoc(r.id, r.before); else removeDoc(r.id); });
  toast('되돌렸어요.');
}
function toggleDone(id){
  const it = getDoc(id); if (!it || S.readOnly) return;
  record([id]);
  const done = !it.done;
  patchDoc(id, {done, doneAt: done ? nowIso() : null});
  toast(done ? '완료한 일정으로 바꿨어요.' : '완료를 취소했어요.', [['되돌리기', doUndo]]);
}
function softDelete(id){
  record([id]);

}

/* ---------- quick parse (no AI) ---------- */
const TIME = '(오전|오후|아침|낮|저녁|밤|새벽)?\\s*(\\d{1,2})(?::(\\d{2})|\\s*시(?!간)(?:\\s*(\\d{1,2})\\s*분|\\s*(반))?)';
const RE_RANGE = new RegExp(TIME + '\\s*(?:~|-|–|부터)\\s*' + TIME + '(?:\\s*까지)?');
const RE_TIME = new RegExp(TIME);
function toHM(ap, h, colon, min, half){
  h = +h; const m = colon != null ? +colon : (min != null ? +min : (half ? 30 : 0));
  if (ap === '오후' || ap === '저녁' || ap === '밤') { if (h < 12) h += 12; }
  else if (ap === '오전' || ap === '아침' || ap === '새벽') { if (h === 12) h = 0; }
  else if (ap === '낮') { if (h < 6) h += 12; }
  else if (colon == null && h >= 1 && h <= 7) h += 12;
  if (h > 23 || m > 59) return null;
  return pad(h) + ':' + pad(m);
}
function smartYear(mo, d, today){ let x = new Date(today.getFullYear(), mo - 1, d); if (x < addDays(today, -60)) x = new Date(today.getFullYear() + 1, mo - 1, d); return x; }
function parseQuick(text, now){
  const today = sod(now);
  let s = ' ' + text.trim() + ' ', date = null, t1 = null, t2 = null;
  const take = (re, fn) => { const m = s.match(re); if (!m) return false; if (fn(m) === false) return false; s = s.replace(m[0], ' '); return true; };
  take(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/, m => { date = new Date(+m[1], m[2] - 1, +m[3]); });
  if (!date) take(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/, m => { date = smartYear(+m[1], +m[2], today); });
  if (!date) take(/(^|\s)(\d{1,2})\/(\d{1,2})(?=\s)/, m => { date = smartYear(+m[2], +m[3], today); });
  if (!date) take(/(오늘|금일)/, () => { date = today; });
  if (!date) take(/내일/, () => { date = addDays(today, 1); });
  if (!date) take(/모레/, () => { date = addDays(today, 2); });
  if (!date) take(/글피/, () => { date = addDays(today, 3); });
  if (!date) take(/(이번\s*주|금주|다다음\s*주|다음\s*주|담주|차주)?\s*([월화수목금토일])\s*요일/, m => {
    const pre = (m[1] || '').replace(/\s/g, '');
    const dow = {'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6}[m[2]];
    const idx = (dow + 6) % 7, monday = addDays(today, -((today.getDay() + 6) % 7));
    if (pre === '다음주' || pre === '담주' || pre === '차주') date = addDays(monday, 7 + idx);
    else if (pre === '다다음주') date = addDays(monday, 14 + idx);
    else if (pre === '이번주' || pre === '금주') date = addDays(monday, idx);
    else date = addDays(today, (dow - today.getDay() + 7) % 7);
  });
  if (!take(RE_RANGE, m => { t1 = toHM(m[1], m[2], m[3], m[4], m[5]); t2 = toHM(m[6] || m[1], m[7], m[8], m[9], m[10]); if (!t1) return false; if (t2 && t2 <= t1) { const h = +t2.slice(0, 2); t2 = h < 12 ? pad(h + 12) + t2.slice(2) : null; } }))
    take(RE_TIME, m => { t1 = toHM(m[1], m[2], m[3], m[4], m[5]); if (!t1) return false; });
  const title = s.replace(/\s(까지|에|에서|부터|쯤|경)(?=\s)/g, ' ').replace(/^[\s,·.\-]+|[\s,·.\-]+$/g, '').replace(/\s+/g, ' ').trim();
  return {title, date: date ? ymd(date) : null, start: t1, end: t2 && t2 > t1 ? t2 : null};
}

const clampInt = (v, lo, hi, d) => { if (v === '' || v == null) return d; const n = Math.round(+v); return isNaN(n) ? d : Math.max(lo, Math.min(hi, n)); };
const mm = m => fromMin(((Math.round(m) % 1440) + 1440) % 1440);
function rtNorm(o){

const daysText = days => { const k = days.slice().sort().join(''); return k === '0123456' ? '매일' : k === '12345' ? '평일' : k === '06' ? '주말' : [1, 2, 3, 4, 5, 6, 0].filter(d => days.includes(d)).map(d => WD[d]).join('·'); };

function rtPatchLog(rid, fn){

  const cur = getDoc(id) || {type: 'rlog', rid, date: M.today, done: {}, started: {}, extra: {}, skip: false, createdAt: nowIso()};
  const nx = JSON.parse(JSON.stringify(cur)); nx.done = nx.done || {}; nx.started = nx.started || {}; nx.extra = nx.extra || {};

}
function rtFind(rid, sid){ const rt = M.routines.find(r => r.id === rid); if (!rt) return null; const s = rtToday(rt); return {rt, s, row: s.rows.find(r => r.id === sid)}; }

  else if (s.cur) toast(msg + ' 지금: ' + s.cur.name);

}

/* alarms: start (repeats until confirmed), check-ins while running, end question, 10 minutes before leaving */
function rtAlarmTimes(rt){
  // only the first unfinished step rings, so a skipped step never gets buried under the next one
  if (!rtActiveOn(rt, M.today)) return [];
  const s = rtToday(rt); if (s.skip || s.finished) return [];
  const base = sod(M.now), T = m => addMin(base, m), out = [], rows = s.rows, last = rows[rows.length - 1];
  if (last && last.kind === 'wait') out.push({t: T(last.at + last.min), sid: last.id, k: 'w', kind: 'wait'});
  const leave = rows.find(r => r.leave);
  if (leave && !leave.done) out.push({t: T(leave.at - 10), sid: leave.id, k: 'h', kind: 'heads'});
  const todo = rows.filter(r => r.kind !== 'wait'), i = todo.findIndex(r => !r.done);
  if (i < 0) return out;
  const r = todo[i], prev = i > 0 ? todo[i - 1] : null;
  if (!r.started) {
    // a late finish of the previous step moves the nudge to two minutes after it
    let b = r.at;
    if (prev && prev.done && prev.done !== 'auto') { const pm = (new Date(prev.done) - base) / 60000 + 2; if (pm > b) b = pm; }
    for (let k = 0; k <= rt.times; k++) out.push({t: T(b + k * rt.every), sid: r.id, k: 's' + k + '_' + Math.round(b), kind: 'start', n: k});
    return out;
  }
  if (r.min <= 0) return out;
  const st = new Date(r.started), endM = Math.round(r.endM), end = T(r.endM);
  if (rt.check) for (let m = rt.check; m < 600; m += rt.check) { const t = addMin(st, m); if (t.getTime() >= end.getTime() - 3 * 60000) break; out.push({t, sid: r.id, k: 'c' + m, kind: 'check'}); }
  for (let k = 0; k <= 3; k++) out.push({t: addMin(end, k * rt.every), sid: r.id, k: 'e' + endM + '_' + k, kind: 'end', n: k});
  return out;
}
function rtAlarmOk(a){

  const r = f.row;
  if (a.kind === 'start') return !r.done && !r.started;
  if (a.kind === 'check' || a.kind === 'end') return !r.done;
  if (a.kind === 'heads') return !r.done;

}

let L = null;
function openLate(id){
  const it = getDoc(id); if (!it) return;

function lateOptions(it){
  const now = new Date(), today = ymd(now), nowM = now.getHours() * 60 + now.getMinutes();
  const dur = it.start && it.end ? toMin(it.end) - toMin(it.start) : 0;
  const delay = [];
  if (it.start) [30, 60, 120, 180].forEach(d => { const s = Math.ceil((nowM + d) / 10) * 10; const ok = s + dur <= 23 * 60 + 59; delay.push({key: 'd' + d, label: d < 60 ? d + '분 뒤' : (d / 60) + '시간 뒤', sub: ok ? fromMin(s) : '오늘 안 됨', ok, sel: {type: 'delay', start: s}}); });
  const t = sod(now), tm = it.start ? ' ' + it.start : '';
  const move = [
    {key: 'm1', label: '내일', sub: (addDays(t, 1).getMonth() + 1) + '.' + addDays(t, 1).getDate() + tm, sel: {type: 'move', date: ymd(addDays(t, 1))}},
    {key: 'm2', label: '모레', sub: (addDays(t, 2).getMonth() + 1) + '.' + addDays(t, 2).getDate() + tm, sel: {type: 'move', date: ymd(addDays(t, 2))}},
    {key: 'm7', label: '다음 주 월', sub: (nextMonday(t).getMonth() + 1) + '.' + nextMonday(t).getDate() + tm, sel: {type: 'move', date: ymd(nextMonday(t))}}
  ];
  if (it.date < today) move.unshift({key: 'm0', label: '오늘로', sub: (t.getMonth() + 1) + '.' + t.getDate() + tm, sel: {type: 'move', date: today}});
  return {delay, move};
}
function drawLate(){
  const it = getDoc(L.id); if (!it) { closeSheet(); return; }
  const o = lateOptions(it);
  const pick = (x, cls) => '<button type="button" class="pick warnsel' + (cls || '') + '" data-late-opt="' + x.key + '" aria-pressed="' + (L.sel && L.sel.key === x.key) + '"' + (x.ok === false ? ' disabled' : '') + '>' + x.label + ' <small>' + esc(x.sub) + '</small></button>';
  const customOn = L.sel && L.sel.key === 'custom';
  setSheet(
    '<div class="late-card"><i class="lampdot"></i><div><div class="lc-t">' + (esc(it.title) || '(제목 없음)') + '</div><div class="lc-m">' + esc(relDay(it.date, ymd(new Date())) + ' ' + timeText(it)) + ' · ' + esc(agoText(new Date() - dueAt(it))) + '</div></div></div>' +

    '<div class="fld"><div class="fld-l">연기 · 다른 날로 옮기기</div><div class="picks">' + o.move.map(x => pick(x)).join('') + '<button type="button" class="pick warnsel" data-late-opt="custom" aria-pressed="' + customOn + '">날짜 선택</button></div>' +
    (customOn ? '<div class="inline"><label class="sr" for="late-date">옮길 날짜</label><input type="date" id="late-date" class="inp" value="' + esc(L.sel.date || '') + '" min="' + ymd(new Date()) + '"></div>' : '') +
    '</div>' +
    '<button type="button" class="link-btn ack-btn" data-act="late-ack">' + ICON.check + '확인만 하고 깜빡임 끄기</button>',
    '<button type="button" class="btn" data-act="late-edit">' + ICON.edit + '수정</button><button type="button" class="btn" data-act="late-done">' + ICON.check + '완료</button><button type="button" class="btn primary grow" data-act="late-apply" id="late-apply"' + (L.sel && (L.sel.type !== 'move' || L.sel.date) ? '' : ' disabled') + '>' + esc(lateApplyLabel()) + '</button>');

function lateApplyLabel(){
  const s = L && L.sel; if (!s) return '골라서 적용';

function checkAlarms(){
  if (!M || !S.firstServer) return;

  let added = false;

      const key = it.id + '@' + r.getTime();
      if (fired.has(key)) return;
      fired.add(key);

    });
  });
  let rtAdded = false;

      const key = 'rt:' + rt.id + ':' + M.today + ':' + x.sid + ':' + x.k;
      if (fired.has(key)) return;
      fired.add(key);
      if (now - x.t > 10 * 60000) return;

      '<div class="alarm-a"><button type="button" class="btn sm primary" data-alarm="done">완료</button><button type="button" class="btn sm" data-alarm="10">10분 뒤</button><button type="button" class="btn sm" data-alarm="60">1시간 뒤</button><button type="button" class="btn sm" data-alarm="open">열기</button><button type="button" class="btn sm" data-alarm="close">닫기</button></div></div>';
